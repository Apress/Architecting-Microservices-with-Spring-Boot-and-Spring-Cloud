version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: chargeroute-redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_REPLICATION_MODE=master
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - chargeroute-network

volumes:
  redis-data:
    driver: local

networks:
  chargeroute-network:
    driver: bridge
    name: chargeroute-network