spring:
  application:
    name: notification-management-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000/realms/ev-charging
      client:
        registration:
          notification-service-client:
            provider: keycloak
            client-id: ${client-id}
            client-secret: ${client-secret}
            authorization-grant-type: client_credentials
            scope: service.internal
        provider:
          keycloak:
            token-uri: http://localhost:9000/realms/ev-charging/protocol/openid-connect/token
  datasource:
    url: jdbc:postgresql://localhost:5433/notificationdb
    username: notificationservice
    # password provided by Vault via Config Server (spring.datasource.password)
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    placeholder-replacement: false
  # Spring Cloud Stream Configuration for Event-Driven Architecture
  cloud:
    stream:
      bindings:
        # Input binding - consume UserRegistered events
        handleUserRegistered-in-0:
          destination: user-events
          group: notification-service
          content-type: application/json
      function:
        definition: handleUserRegistered
      rabbit:
        bindings:
          handleUserRegistered-in-0:
            consumer:
              auto-bind-dlq: true
              republish-to-dlq: true
              max-attempts: 3
              initial-interval: 1000
              multiplier: 2.0
  # RabbitMQ Connection
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://${eureka.username}:${eureka.password}@localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: false
    hostname: localhost
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
