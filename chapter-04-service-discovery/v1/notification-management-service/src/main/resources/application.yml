server:
  port: 8084

spring:
  application:
    name: notification-service

logging:
  level:
    com.chargeroute.notification: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%logger{36}] - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always