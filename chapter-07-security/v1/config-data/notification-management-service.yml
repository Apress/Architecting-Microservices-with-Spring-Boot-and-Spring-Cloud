spring:
  application:
    name: notification-management-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000
      client:
        registration:
          notification-service-client:
            provider: spring-auth-server
            client-id: notification-service-client
            client-secret: notification-secret
            authorization-grant-type: client_credentials
            scope: service.internal
        provider:
          spring-auth-server:
            token-uri: http://localhost:9000/oauth2/token

eureka:
  client:
    service-url:
      defaultZone: http://chargeroute:Admin123!@localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: false
    hostname: localhost
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
