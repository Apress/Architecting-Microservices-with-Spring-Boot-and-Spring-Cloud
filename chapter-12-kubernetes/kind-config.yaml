# Kind cluster configuration for ChargeRoute platform
# Creates a 3-node cluster (1 control plane + 2 workers)
# Port mappings enable NGINX Ingress to work with localhost

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  # Control plane node
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # HTTP port mapping for Ingress
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      # HTTPS port mapping for Ingress
      - containerPort: 443
        hostPort: 443
        protocol: TCP

  # Worker node 1
  - role: worker

  # Worker node 2
  - role: worker
