# Test Configuration for User Management Service (Reactive)
# Configured for H2 in-memory database with R2DBC

server:
  port: 0  # Random port for testing

spring:
  application:
    name: user-management-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.cloud.stream.binder.rabbit.config.RabbitServiceAutoConfiguration
  # R2DBC H2 configuration for tests
  r2dbc:
    url: r2dbc:h2:mem:///testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
  # JDBC H2 for Flyway migrations
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    clean-disabled: false
    baseline-on-migrate: true
  cloud:
    stream:
      bindings:
        userRegistered-out-0:
          destination: test-user-events
        userUpdated-out-0:
          destination: test-user-events
    function:
      definition: ''  # No functions to bind in tests

logging:
  level:
    com.chargeroute.user: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
