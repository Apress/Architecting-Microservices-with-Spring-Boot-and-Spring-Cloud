apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chargeroute-ingress
  namespace: chargeroute
  labels:
    app: chargeroute
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /api/users
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 8080
      - path: /api/charge-units
        pathType: Prefix
        backend:
          service:
            name: charge-unit-service
            port:
              number: 8080
      - path: /api/sessions
        pathType: Prefix
        backend:
          service:
            name: session-service
            port:
              number: 8080
      - path: /api/notifications
        pathType: Prefix
        backend:
          service:
            name: notification-service
            port:
              number: 8080
