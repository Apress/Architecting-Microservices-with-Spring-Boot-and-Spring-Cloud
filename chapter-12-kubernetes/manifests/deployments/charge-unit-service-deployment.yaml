apiVersion: apps/v1
kind: Deployment
metadata:
  name: charge-unit-service
  namespace: chargeroute
  labels:
    app: charge-unit-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: charge-unit-service
  template:
    metadata:
      labels:
        app: charge-unit-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
      - name: charge-unit-service
        image: charge-unit-management-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: SPRING_CONFIG_IMPORT
          value: "optional:file:/config/application.yml"
        - name: DATABASE_HOST
          value: "host.docker.internal"
        - name: DATABASE_PORT
          value: "5433"
        - name: DATABASE_NAME
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: chargeunit-db-name
        - name: DATABASE_URL
          value: "r2dbc:postgresql://host.docker.internal:5433/$(DATABASE_NAME)"
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: password
        - name: RABBITMQ_HOST
          value: "rabbitmq"
        - name: RABBITMQ_PORT
          value: "5672"
        - name: SPRING_RABBITMQ_HOST
          value: "rabbitmq"
        - name: SPRING_RABBITMQ_PORT
          value: "5672"
        - name: SPRING_RABBITMQ_USERNAME
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secrets
              key: username
        - name: SPRING_RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secrets
              key: password
        - name: ZIPKIN_URL
          value: "http://host.docker.internal:9411"
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: charge-unit-service-config
          items:
          - key: application.yml
            path: application.yml
