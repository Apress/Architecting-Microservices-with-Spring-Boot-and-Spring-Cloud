# API Gateway bootstrap configuration for v3
spring:
  application:
    name: api-gateway
  config:
    import:
      - "configserver:http://configuser:configpass@localhost:8888"
  cloud:
    config:
      fail-fast: true
      retry:
        initial-interval: 1000
        max-interval: 5000
        max-attempts: 5
    vault:
      # Configure Vault to use HTTP (same as Config Server Vault setup)
      host: localhost
      port: 8200
      scheme: http
      authentication: TOKEN
      token: ${VAULT_TOKEN:dev-root-token}
      kv-version: 2

# Note: In production, retrieve Config Server credentials from Vault.
# For simplicity in this chapter, we're using hardcoded credentials.
# The Config Server itself will retrieve all configuration from Vault.