# Test Configuration for User Management Service
# Disables Eureka for unit testing to avoid connection failures

server:
  port: 0  # Random port for testing

spring:
  application:
    name: user-management-service
  cloud:
    discovery:
      enabled: false  # Disable discovery for unit tests

eureka:
  client:
    enabled: false  # Disable Eureka client for unit tests
    register-with-eureka: false
    fetch-registry: false

logging:
  level:
    com.chargeroute.user: DEBUG
    com.netflix.discovery: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always