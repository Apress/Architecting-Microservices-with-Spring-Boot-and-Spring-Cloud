spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:http://configuser:configpass@localhost:8888"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000/realms/ev-charging

# Minimal local config - everything else comes from Config Server
server:
  port: 8080

eureka:
  username: chargeroute
  password: Admin123!
  client:
    service-url:
      defaultZone: http://chargeroute:Admin123!@localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,gateway,prometheus
  health:
    redis:
      enabled: false

---
# Docker profile configuration  
spring:
  config:
    activate:
      on-profile: docker
    import: "optional:configserver:http://configuser:configpass@config-server:8888"