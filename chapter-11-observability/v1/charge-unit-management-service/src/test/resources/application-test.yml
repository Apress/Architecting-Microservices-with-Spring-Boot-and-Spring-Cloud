spring:
  application:
    name: charge-unit-management-service
  # R2DBC configuration will be provided by @DynamicPropertySource in test
  r2dbc:
    pool:
      initial-size: 5
      max-size: 10
  # JDBC datasource will be provided by @DynamicPropertySource for Flyway
  datasource: {}
  flyway:
    enabled: true
    clean-disabled: false
    baseline-on-migrate: true
  cloud:
    config:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9999

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

server:
  port: 0
