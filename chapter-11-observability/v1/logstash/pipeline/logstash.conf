input {
  # File input for service logs
  file {
    path => "/usr/share/logstash/logs/*.log"
    start_position => "beginning"
    codec => "json"
    type => "chargeroute-logs"
  }

  # TCP input for direct log streaming (future use)
  tcp {
    port => 5000
    codec => json_lines
    type => "chargeroute-logs"
  }
}

filter {
  # Parse JSON logs
  if [type] == "chargeroute-logs" {
    json {
      source => "message"
      skip_on_invalid_json => true
    }

    # Add computed fields
    mutate {
      add_field => {
        "[@metadata][index]" => "chargeroute-logs-%{+YYYY.MM.dd}"
      }
    }

    # Parse trace context if present
    if [traceId] {
      mutate {
        add_field => { "trace_id" => "%{traceId}" }
      }
    }
    if [spanId] {
      mutate {
        add_field => { "span_id" => "%{spanId}" }
      }
    }
  }

  # Date parsing
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
}

output {
  # Output to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][index]}"
    document_type => "_doc"
  }

  # Debug output (optional, can remove in production)
  stdout {
    codec => rubydebug
  }
}
