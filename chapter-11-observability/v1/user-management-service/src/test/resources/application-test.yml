# Test Configuration for User Management Service (Reactive)
# Configured for R2DBC with Testcontainers Postgres

server:
  port: 0  # Random port for testing

spring:
  application:
    name: user-management-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.cloud.stream.binder.rabbit.config.RabbitServiceAutoConfiguration
  # R2DBC configuration will be provided by @DynamicPropertySource in test
  r2dbc:
    pool:
      initial-size: 5
      max-size: 10
  # JDBC datasource will be provided by @DynamicPropertySource for Flyway
  datasource: {}
  flyway:
    enabled: true
    clean-disabled: false
    baseline-on-migrate: true
  cloud:
    config:
      enabled: false  # Disable Config Server for unit tests
    discovery:
      enabled: false  # Disable discovery for unit tests
    stream:
      bindings:
        userRegistered-out-0:
          destination: test-user-events
        userUpdated-out-0:
          destination: test-user-events
    function:
      definition: ''  # No functions to bind in tests
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}  # Won't be used with test binder
    port: 5672
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9999  # Mock issuer for tests

eureka:
  client:
    enabled: false  # Disable Eureka client for unit tests
    register-with-eureka: false
    fetch-registry: false

logging:
  level:
    com.chargeroute.user: DEBUG
    com.netflix.discovery: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always